name: Deploy Wedding Invitation to GitHub Pages

on:
  push:
    branches: ['main', 'invitation-parallax-v2']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        working-directory: ./invitation-v2
        run: npm ci
        
      - name: Build
        working-directory: ./invitation-v2
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Override root with MemoryWrapped landing
        run: cp ./invitation-v2/public/index.html ./invitation-v2/dist/index.html

      - name: Add Salem Night Companion subpage
        run: |
          mkdir -p ./invitation-v2/dist/Salem
          cp ./Salem/site/index.html ./Salem/site/styles.css ./Salem/site/app.js ./Salem/site/config.js ./Salem/site/game-core.js ./Salem/site/game-engine.js ./Salem/site/store.js ./invitation-v2/dist/Salem/
          mkdir -p ./invitation-v2/dist/salem
          cp -R ./invitation-v2/dist/Salem/. ./invitation-v2/dist/salem/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './invitation-v2/dist'
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
