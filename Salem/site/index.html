<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11100f" />
    <meta name="description" content="A private night companion for Salem 1692." />
    <title>Salem Night Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <div class="ambient" aria-hidden="true">

      <a class="wordmark" href="./" aria-label="Salem Night Companion home">

    <noscript>This companion requires JavaScript.</noscript>
    <script src="./config.js?v=20260829c"></script>
    <script type="module" src="./app.js?v=20260830e"></script>
